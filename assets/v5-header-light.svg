<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 180" width="830" height="180" role="img" aria-labelledby="t d">
  <title id="t">Konstantin Merenkov</title>
  <desc id="d">Mobile engineer. Kotlin Multiplatform, Android and iOS. Sydney, Australia.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .ink{fill:#1f2328}
    .mut{fill:#59636e}
    .hair{fill:none;stroke:#d1d9e0}
    .grat{fill:none;stroke:#cdd5dc}
    .pin{fill:none;stroke:#59636e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .acc{fill:#b84309}
    .mono{fill:#1f2328;fill-opacity:.06}
    .ph{fill:none;stroke:#1f2328;stroke-opacity:.14}
    .pulse{opacity:0;transform-box:fill-box;transform-origin:center}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}}
    @keyframes fade{from{opacity:0}}
    @keyframes draw{from{stroke-dashoffset:277}}
    @keyframes pulse{0%{opacity:.45;transform:scale(1)}70%,100%{opacity:0;transform:scale(4.4)}}
    @media (prefers-reduced-motion:no-preference){
      .in{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
      .d1{animation-delay:.08s}
      .d2{animation-delay:.16s}
      .d3{animation-delay:.24s}
      .ring{animation:draw 1.3s cubic-bezier(.5,0,.2,1) .1s both}
      .globe{animation:fade 1.6s ease-out .25s both}
      .pulse{animation:pulse 3s ease-out 1.6s infinite}
    }
  </style>
  <defs>
    <clipPath id="card"><rect x=".5" y=".5" width="829" height="179" rx="14"/></clipPath>
    <clipPath id="av"><circle cx="76" cy="90" r="38"/></clipPath>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="764" cy="121" r="250">
      <stop offset="0" stop-color="#b84309" stop-opacity=".09"/>
      <stop offset="1" stop-color="#b84309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reveal" gradientUnits="userSpaceOnUse" x1="610" y1="0" x2="735" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="830" height="180"><rect width="830" height="180" fill="url(#reveal)"/></mask>
  </defs>

  <!-- Card surface: warm glow and the globe, clipped to the card -->
  <g clip-path="url(#card)">
    <rect width="830" height="180" fill="url(#glow)"/>
    <g class="globe">
      <!-- Orthographic graticule, centre 20°S 135°E, radius 125 at (735, 90), every 15° -->
      <g class="grat" mask="url(#m)">
        <circle cx="735" cy="90" r="125"/>
        <path d="M629.2 23.5A108.25 37.02 0 0 1 840.8 23.5M614.8 55.6A120.74 41.29 0 0 1 855.2 55.6M610 90A125 42.75 0 0 1 860 90M614.8 124.4A120.74 41.29 0 1 1 855.2 124.4M629.2 156.5A108.25 37.02 0 1 1 840.8 156.5M652.7 184.1A88.39 30.23 0 1 1 817.3 184.1M686.5 205.2A62.5 21.4 0 1 1 783.5 205.2"/>
        <path d="M735 207.46V-35M735 207.46A30.4 125 5.24 0 0 746.4 -34.5M735 207.46A30.4 125 -5.24 0 1 723.6 -34.5M735 207.46A58.73 125 11.17 0 0 759.2 -32.6M735 207.46A58.73 125 -11.17 0 1 710.8 -32.6M735 207.46A83.06 125 18.88 0 0 775.5 -28.3M735 207.46A83.06 125 -18.88 0 1 694.5 -28.3M735 207.46A101.72 125 30.64 0 0 798.7 -17.5M735 207.46A101.72 125 -30.64 0 1 671.3 -17.5M735 207.46A113.46 125 51.92 0 0 833.4 12.9M735 207.46A113.46 125 -51.92 0 1 636.6 12.9M735 207.46A125 117.46 0 0 0 860 90M735 207.46A125 117.46 0 0 1 610 90"/>
      </g>
      <!-- Sydney, 33.87°S 151.21°E -->
      <circle cx="764" cy="121.4" r="3.5" class="acc pulse"/>
      <circle cx="764" cy="121.4" r="3.5" class="acc"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="829" height="179" rx="14" class="hair"/>

  <!-- Avatar: v5-embed.mjs swaps the monogram for the photo -->
  <g class="in">
    <circle cx="76" cy="90" r="44" class="hair ring" stroke-dasharray="277" transform="rotate(-90 76 90)"/>
    <!--v5:avatar--><image x="38" y="52" width="76" height="76" preserveAspectRatio="xMidYMid slice" clip-path="url(#av)" href="data:image/jpeg;base64,"/><circle cx="76" cy="90" r="37.5" class="ph"/><!--/v5:avatar-->
  </g>

  <text x="140" y="76" font-size="32" font-weight="700" letter-spacing="-.6" class="ink in d1">Konstantin Merenkov</text>
  <text x="140" y="104" font-size="16" class="mut in d2"><tspan class="ink">Mobile engineer</tspan> · Kotlin Multiplatform · Android &amp; iOS</text>
  <g class="in d3">
    <g class="pin" transform="translate(137.3 115) scale(.667)"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></g>
    <text x="157" y="128" font-size="14" class="mut">Sydney, Australia</text>
  </g>
</svg>
